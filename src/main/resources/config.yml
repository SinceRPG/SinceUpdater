# =============================================================
#                  SINCEUPDATER CONFIGURATION
# =============================================================

# Define all internal API URLs to prevent hardcoding inside the plugin logic
urls:
  citizens:
    base-job: "https://ci.citizensnpcs.co/job/Citizens2/"
    max-search-depth: 15
  essentials:
    jenkins: "https://ci.ender.zone/job/EssentialsX/lastSuccessfulBuild/api/json"
    download-base: "https://ci.ender.zone/job/EssentialsX/lastSuccessfulBuild/artifact/"
  fawe:
    jenkins: "https://ci.athion.net/job/FastAsyncWorldEdit/lastSuccessfulBuild/api/json"
    download-base: "https://ci.athion.net/job/FastAsyncWorldEdit/lastSuccessfulBuild/artifact/"
  phoenix:
    api-metadata: "https://phoenixdevt.fr/api/nexus/assets"
    download-root: "https://phoenixdevt.fr/api/nexus/assets/"

# -------------------------------------------------------------
# Citizens Auto-updater
# Automatically downloads the latest build from Citizens Jenkins.
# Logic: Checks server version to download the correct NMS module.
# -------------------------------------------------------------
citizens-updater:
  enabled: false
  check-interval: 6
  old_build:
    citizens-v1_20_R1: 3208
    citizens-v1_20_R2: 3282
    citizens-v1_20_R3: 3399
    citizens-v1_20_R4: 4016
    citizens-v1_21_R1: 3598
    citizens-v1_21_R2: 3644
    citizens-v1_21_R3: 3763
    citizens-v1_21_R4: 3821
    citizens-v1_21_R5: 4138
    citizens-v1_21_R6: latest
    citizens-v1_21_R7: latest
    citizens-v26_1_R1: latest

# -------------------------------------------------------------
# EssentialsX Auto-updater
# Automatically downloads the latest build from EssentialsX Jenkins.
# -------------------------------------------------------------
essentials-updater:
  enabled: true
  check-interval: 6

  # List of EssentialsX modules.
  # Set 'true' for the modules you are CURRENTLY USING on the server.
  # The plugin will automatically download the corresponding jar file.
  modules:
    EssentialsX: true
    EssentialsXSpawn: true
    EssentialsXChat: false
    EssentialsXDiscord: false
    EssentialsXGeoIP: false
    EssentialsXProtect: false
    EssentialsXAntiBuild: false
    EssentialsXXMPP: false

# -------------------------------------------------------------
# FastAsyncWorldEdit (FAWE) Auto-updater
# Automatically downloads the latest build from Athion Jenkins (FAWE).
# Logic: Automatically detects Paper or Bukkit version to download.
# -------------------------------------------------------------
fawe-updater:
  enabled: true
  check-interval: 6

# -------------------------------------------------------------
# Mythic Auto-updater
# Automatically scrapes website HTML to get the latest DevBuild version.
# -------------------------------------------------------------
mythic-updater:
  enabled: true
  check-interval: 6
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  # Shared Cookie for all Mythiccraft plugins (F12 -> Application -> Cookies -> https://mythiccraft.io)
  # Examples: xf_user=...; xf_session=...
  # You can also set a specific 'cookie' under any individual plugin below to override this.
  cookie: ""

  downloads:
    MythicMobs:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythicmobs.1/product-devbuild"
      link_keyword: "build="

    MythicCrucible:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythiccrucible.2/product-devbuild"
      link_keyword: "build="

    ModelEngine:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/model-engine%E2%80%94ultimate-entity-model-manager-1-19-4-26-2.1213/product-devbuild"
      link_keyword: "build="

    MythicDungeons:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythic-dungeons.869/product-devbuild"
      link_keyword: "build="

    MythicArmors:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythicarmors.1575/product-devbuild"
      link_keyword: "build="

    MythicCosmetics:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythiccosmetics.818/product-devbuild"
      link_keyword: "build="

    MythicEnchants:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?pages/official-mythicenchants-dev/"
      link_keyword: "build="

    MythicHUD:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/%E2%AD%90mythichud%E2%AD%90custom-bars-and-number-displays%E2%9C%85replace-vanilla-look%E2%9C%85auto-resource-pack-builder.394/product-devbuild"
      link_keyword: "build="

    MythicAchievements:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythicachievements.915/product-devbuild"
      link_keyword: "build="

    MythicRPG:
      enabled: true
      page_url: "https://mythiccraft.io/index.php?resources/mythicrpg-spells-classes-professions-more.129/product-devbuild"
      link_keyword: "build="

# -------------------------------------------------------------
# Phoenix Auto-updater (MMO series)
# -------------------------------------------------------------
phoenix-updater:
  enabled: false
  check-interval: 6

  # Session token from browser Cookies (F12 -> Application -> Cookies)
  session-token: ""

  # Target Role IDs corresponding to plugin assets
  plugins:
    MMOCore: "983060802141577216"
    MMOItems: "596393529790693391"
    MMOProfiles: "1105585475370098689"
    MMOInventory: "983060898333741127"
    MythicLib-dist: "free"