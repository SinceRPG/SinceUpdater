# =============================================================
#                 SINCEUPDATER CONFIGURATION
# =============================================================

# -------------------------------------------------------------
# Citizens Auto-updater
# Automatically downloads the latest build from Citizens Jenkins.
# Logic: Checks server version to download the correct NMS module.
# -------------------------------------------------------------
citizens-updater:
  # Enable/Disable Citizens auto-updater
  enabled: true
  # Check interval (in Hours)
  check-interval: 6
  old_build:
    citizens-v1_20_R1: 3208
    citizens-v1_20_R2: 3282
    citizens-v1_20_R3: 3399
    citizens-v1_20_R4: 4016
    citizens-v1_21_R1: 3598
    citizens-v1_21_R2: 3644
    citizens-v1_21_R3: 3763
    citizens-v1_21_R4: 3821
    citizens-v1_21_R5: latest
    citizens-v1_21_R6: latest
    citizens-v1_21_R7: latest

# -------------------------------------------------------------
# EssentialsX Auto-updater
# Automatically downloads the latest build from EssentialsX Jenkins.
# -------------------------------------------------------------
essentials-updater:
  enabled: true
  check-interval: 6

  # List of EssentialsX modules.
  # Set 'true' for the modules you are CURRENTLY USING on the server.
  # The plugin will automatically download the corresponding jar file.
  modules:
    EssentialsX: true
    EssentialsXSpawn: false
    EssentialsXChat: false
    EssentialsXDiscord: false
    EssentialsXGeoIP: false
    EssentialsXProtect: false
    EssentialsXAntiBuild: false
    EssentialsXXMPP: false

# -------------------------------------------------------------
# FastAsyncWorldEdit (FAWE) Auto-updater
# Automatically downloads the latest build from Athion Jenkins (FAWE).
# Logic: Automatically detects Paper or Bukkit version to download.
# -------------------------------------------------------------
fawe-updater:
  enabled: true
  check-interval: 6


# -------------------------------------------------------------
# Mythic Auto-updater
# Tự động quét HTML trang web để lấy phiên bản DevBuild mới nhất
# -------------------------------------------------------------
mythic-updater:
  enabled: true
  check-interval: 6
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  downloads:
    MythicMobs:
      page_url: "https://mythiccraft.io/index.php?resources/1/product-devbuild"
      link_keyword: "build="
      cookie: ""
    
    MythicCrucible:
      page_url: "https://mythiccraft.io/index.php?pages/official-mythiccrucible-dev/"
      link_keyword: "build="
      cookie: ""